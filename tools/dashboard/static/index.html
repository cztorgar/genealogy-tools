<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-token" content="__CSRF_TOKEN__">
<title>Workbench dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<header id="bar">
  <strong id="title">Workbench</strong>
  <nav id="tabs"><button data-tab="strom" class="on">Strom</button><button data-tab="mapa">Mapa</button><button data-tab="kontroly" title="Fronta kontrol — co musíš rozhodnout ty">Kontroly <span id="k-count"></span></button></nav>
  <div id="counts"></div>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Hledat jméno nebo ID…" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
  <label class="tree-only"><input type="checkbox" id="f-work"> jen rozpracované</label>
  <label class="tree-only"><input type="checkbox" id="f-wait"> čeká na mě</label>
  <label class="tree-only" title="jen osoby, které mají aspoň jeden údaj doložený jediným pramenem"><input type="checkbox" id="f-single"> údaje jen s 1 pramenem</label>
  <label class="tree-only" title="zkoumané osoby s příznakem kontext: chybí (chybí sekce Kontext nebo příběh)"><input type="checkbox" id="f-nokx"> chybí kontext/příběh</label>
  <label class="tree-only" title="původ osoby (front-matter původ v dossieru)">původ <select id="f-orig">
    <option value="">vše</option><option value="myheritage">MH — MyHeritage</option><option value="pramen">★P — z pramene</option>
    <option value="ústně">Ú — ústně</option><option value="-">neuvedeno</option></select></label>
  <label class="tree-only" title="u přímých předků ukázat prázdné rámečky jejich rodičů"><input type="checkbox" id="f-empty" checked> prázdní rodiče</label>
  <button class="tree-only" id="fit" title="Zobrazit celý strom">celý strom</button>
  <span id="live" title="Automatické obnovení (polling 5 s)">●</span>
</header>
<main>
  <aside id="overview"></aside>
  <section id="canvas">
    <svg id="svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="legend"></div>
  </section>
  <section id="mapwrap" hidden>
    <div id="map"></div>
    <div id="mapbar">
      <select id="m-area" title="Oblast"></select>
      <select id="m-layer" title="Mapový podklad"></select>
      <label title="podklad se mění podle roku na posuvníku"><input type="checkbox" id="m-auto" checked> podklad podle roku</label>
      <label title="dnešní katastrální mapa přes podklad"><input type="checkbox" id="m-km"> katastr</label>
      <label title="šedé tečky všech čísel popisných (dnešní RÚIAN)"><input type="checkbox" id="m-all"> všechna čp</label>
      <label title="jen roky, pro které je záznam v patchi"><input type="checkbox" id="m-exact"> jen doložené</label>
      <div class="timeline">
        <button id="m-play" title="Přehrát">▶</button>
        <input type="range" id="m-year" min="1800" max="2026" value="1880">
        <b id="m-year-label">1880</b>
        <span id="m-count"></span>
      </div>
    </div>
    <div id="maplegend"></div>
  </section>
  <section id="kontrolywrap" hidden>
    <div id="k-filters">
      <label>stav <select id="kf-stav"><option value="otevřeno">otevřené</option><option value="rozhodnuto">rozhodnuté</option><option value="hotovo">zapracované / zamítnuté</option><option value="">vše</option></select></label>
      <label>osoba <select id="kf-osoba"><option value="">všechny</option></select></label>
      <label>typ <select id="kf-typ"><option value="">všechny</option></select></label>
      <span id="k-summary"></span>
    </div>
    <div id="k-list"></div>
  </section>
  <aside id="panel" hidden>
    <button id="close" title="Zavřít (Esc)">×</button>
    <div id="panel-body"></div>
  </aside>
</main>
<div id="lightbox" hidden><img alt=""><a target="_blank" rel="noopener">otevřít v nové kartě</a></div>
<script src="/static/app.js"></script>
<script src="/static/map.js"></script>
<script src="/static/kontroly.js"></script>
</body>
</html>
