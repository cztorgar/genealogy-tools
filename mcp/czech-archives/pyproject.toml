[project]
name = "czech-archives"
version = "0.1.0"
description = "Modulární MCP server pro české archivní portály (matriky) — genealogický workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pillow>=10.0",   # skládání Zoomify dlaždic (modul digi_trebon)
]

[project.scripts]
czech-archives = "czech_archives.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["czech_archives"]
