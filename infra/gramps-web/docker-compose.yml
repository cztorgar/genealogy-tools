# Gramps Web — lokální instance workbenche.
# Vychází z oficiálního příkladu gramps-project/gramps-web-docs (docker-compose-base).
# Média: bind mount na media/ stromu (GRAMPS_MEDIA_DIR v .env).
services:
  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:${GRAMPSWEB_VERSION:-26.10.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAMPSWEB_PORT:-5055}:5000"
    environment:
      # víc stromů: každý podadresář grampsdb = strom; uživatel patří k jednomu stromu
      GRAMPSWEB_TREE: "*"
      GRAMPSWEB_BASE_URL: "http://localhost:${GRAMPSWEB_PORT:-5055}"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: "redis://grampsweb_redis:6379/1"
    depends_on:
      - grampsweb_redis
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - ${GRAMPS_MEDIA_DIR:?nastav GRAMPS_MEDIA_DIR v .env}:/app/media
      - gramps_tmp:/tmp

  grampsweb_celery:
    <<: *grampsweb
    ports: []
    depends_on:
      - grampsweb
      - grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  # Dashboard workbenche (tools/dashboard) — čte živé soubory stromu, Gramps volá po síti dockeru.
  # Svazky: workbench a stromy se stejnou vzájemnou polohou jako na hostiteli (strom.adresar = ../genealogy-trees/…).
  dashboard:
    build: ../../tools/dashboard
    restart: unless-stopped
    user: "${DASHBOARD_UID:-1000}:${DASHBOARD_GID:-1000}"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5056}:5056"
    environment:
      GRAMPSWEB_API_URL: "http://grampsweb:5000/api"
      DASHBOARD_IN_DOCKER: "1"   # POST přichází z brány dockeru; port je publikovaný jen na 127.0.0.1
      DASHBOARD_PUBLIC_PORT: "${DASHBOARD_PORT:-5056}"   # kontrola Origin/Host proti portu, který vidí prohlížeč
    command: ["python", "tools/dashboard/server.py", "--host", "0.0.0.0", "--port", "5056",
              "--gramps-url", "http://localhost:${GRAMPSWEB_PORT:-5055}"]
    volumes:
      - ../..:/ws/genealogy-tools
      - ${GENEALOGY_TREES_DIR:-../../../genealogy-trees}:/ws/genealogy-trees
    depends_on:
      - grampsweb

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_tmp:
